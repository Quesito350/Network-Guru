# Network Guru - builds the app image and publishes it to GitHub's container registry:
#   ghcr.io/quesito350/network-guru:<version>, :<major.minor> and :latest
# Runs when build.bat (release.py) pushes a version tag; it can also be run by hand on a tag.
# The test install (compose.yaml at the top of the repository) pulls this image. Site servers do
# NOT use it: they build their own image with deploy/install.sh, offline.
#
# The image is only pushed after a smoke test: it must start, locked down the way compose runs
# it, and answer /api/health. Every action is pinned to a commit (the version is in the comment).
name: Container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/quesito350/network-guru

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Network Guru
            org.opencontainers.image.description=Site network health dashboard (test install image)

      - name: Build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.dev
          platforms: linux/amd64
          load: true
          tags: network-guru:smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test - it must come up healthy, locked down like compose runs it
        run: |
          docker run -d --name ng-smoke --user 10001:10001 --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --sysctl net.ipv4.ping_group_range="0 2147483647" \
            -v ng-smoke-data:/data -e NETWORKGURU_DEPLOY=compose -e NETWORKGURU_MODE=sim \
            -p 127.0.0.1:8080:8080 network-guru:smoke
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "healthy after about $((i * 2)) s"
              docker logs ng-smoke 2>&1 | grep -v "one-time password" | tail -20
              exit 0
            fi
            sleep 2
          done
          echo "::error::the image did not answer /api/health within 3 minutes"
          docker logs ng-smoke 2>&1 | grep -v "one-time password"
          exit 1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
